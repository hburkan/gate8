# Dart analysis configuration — Gümrük Kontrol Memuru mobile app.
#
# Active when the Flutter project is scaffolded (Phase 31). Self-contained
# strict language settings; the Flutter scaffold will extend this with
# package:flutter_lints/flutter.yaml.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: warning
    unused_local_variable: warning
